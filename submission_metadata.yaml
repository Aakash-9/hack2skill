ai_usage_summary: |
  Used Claude for architecture discussion, code review, and debugging.
  No candidate data was fed to any LLM. All ranking logic is rule-based
  and runs fully offline with no API calls during ranking.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Rule-based ranker with six weighted scoring components: skill match (40%),
  title and career trajectory (22%), years of experience (14%), education tier (8%),
  location (7%), and behavioral signals (9%). Skill matching uses precompiled
  regex patterns against JD-derived keyword sets for O(1) per-skill lookup.
  Behavioral signals from the 23 redrob_signals fields act as a hiring-readiness
  modifier — open_to_work_flag, recruiter_response_rate, interview_completion_rate,
  github_activity_score, and recency. Honeypot detection flags profiles with
  impossible signal combinations (expert skills with zero usage months, perfect
  triple-rate candidates, career months exceeding claimed experience).
  Parallelized across all CPU cores using ProcessPoolExecutor with bulk file read.
  Runtime: ~3 seconds for 100K candidates on 16-core CPU.

